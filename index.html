<style>
:root{
  --paper:#EDF1F2; --grid:#D7E0E4; --card:#FFFFFF; --ink:#16232E;
  --muted:#5F7280; --line:#C9D4DA; --on:#0F766E; --off:#A16207; --dim:#8FA3AE;
  --cell:#F2F5F6; --track:#E7ECEE; --inv:#FFFFFF; --navbg:#FFFFFF;
  --display:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--display);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;padding-top:env(safe-area-inset-top)}
.shell{flex:1 1 auto;min-height:0;display:flex}
.side{display:none}
.work{flex:1 1 auto;min-width:0;min-height:0;display:flex;flex-direction:column}
.split{flex:1 1 auto;min-height:0;display:flex}
main{flex:1 1 auto;min-width:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 28px;width:100%;max-width:720px;margin:0 auto}
.coachpane{display:none;flex-direction:column;min-height:0;min-width:0}
header{
  flex:none;position:relative;padding:22px 16px 16px;width:100%;max-width:720px;margin:0 auto;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;background-position:-1px -1px;
}
.eyebrow{font:600 10px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
h1{font:800 27px/1.02 var(--display);letter-spacing:-.035em;text-transform:uppercase;margin:8px 0 0}
.sub{font:400 13px/1.45 var(--display);color:var(--muted);margin:6px 0 0}
.hact{margin-top:12px}
.speak{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);border-radius:20px;cursor:pointer;
  font:600 10px/1 var(--mono);letter-spacing:.11em;text-transform:uppercase}
.speak .ic{width:15px;height:15px}
.speak[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--inv)}
.deck{display:flex;align-items:center;gap:6px;padding:7px 11px;border:1px solid var(--line);
  background:var(--card);border-radius:24px;width:max-content;max-width:100%}
.deck button{display:flex;align-items:center;justify-content:center;width:32px;height:32px;padding:0;
  border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:16px}
.deck button:hover{background:var(--cell);color:var(--ink)}
.deck button.big{width:38px;height:38px;background:var(--ink);color:var(--inv)}
.deck .dic{width:15px;height:15px}
.deck button.big .dic{width:17px;height:17px}
.deckpos{font:600 9px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
  padding-left:4px;min-width:40px}
.vu{display:flex;align-items:flex-end;gap:2px;height:26px;width:30px;flex:none}
.vu i{flex:1;background:var(--dim);border-radius:1px;height:5%;transition:height .09s linear}
.deck.live .vu i{background:var(--on)}
.deck.live .vu i:nth-child(6){background:var(--off)}
.deck.live .vu i:nth-child(7){background:var(--off)}
.minispk{margin-left:9px;border:0;background:transparent;color:var(--muted);cursor:pointer;
  font:600 9px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;text-decoration:underline}
.save{font:500 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);position:absolute;top:24px;right:16px}

.card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:14px;margin:12px 0}
.lbl{display:block;font:600 10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
input[type=text],input[type=date],input[type=number],textarea{
  width:100%;font:400 15px/1.45 var(--display);color:var(--ink);background:transparent;
  border:0;border-bottom:1px solid var(--line);padding:6px 0;border-radius:0;-webkit-appearance:none;font-family:var(--display);
}
textarea{border:1px solid var(--line);padding:10px;min-height:120px;resize:vertical;border-radius:3px}
input:focus,textarea:focus{outline:2px solid var(--ink);outline-offset:2px}
::placeholder{color:var(--dim)}

.row{display:flex;gap:10px;align-items:flex-start}
.num{font:700 13px/1.6 var(--mono);color:var(--dim);width:20px;flex:none;padding-top:5px}
.grow{flex:1;min-width:0}

.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{font:600 11px/1 var(--mono);min-width:26px;height:26px;padding:0 6px;border-radius:13px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--inv)}
.chip.day[aria-pressed="true"]{background:var(--on);border-color:var(--on)}

.btn{font:600 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:11px 14px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:3px;cursor:pointer}
.btn:disabled{opacity:.4}
.btn.ghost{border-color:transparent;color:var(--muted);padding:8px 0}

.strip{display:flex;gap:3px;align-items:flex-end;height:96px;position:relative;margin:4px 0 6px}
.target{position:absolute;left:0;right:0;bottom:85%;border-top:1px dashed var(--dim);pointer-events:none}
.target span{position:absolute;right:0;top:-13px;font:600 9px/1 var(--mono);color:var(--dim)}
.cell{flex:1;height:100%;position:relative;background:var(--cell);border:1px solid var(--line);border-radius:2px;padding:0;cursor:pointer;overflow:hidden}
.cell[aria-current="true"]{border-color:var(--ink);border-width:2px}
.fill{position:absolute;left:0;right:0;bottom:0;background:var(--on)}
.fill.low{background:var(--off)}
.cellnum{position:absolute;left:0;right:0;bottom:2px;font:600 9px/1 var(--mono);color:var(--muted)}
.fill+.cellnum{color:var(--inv)}

.stats{display:flex;gap:10px;margin-top:12px}
.stat{flex:1;border-top:2px solid var(--ink);padding-top:7px}
.statv{font:700 25px/1 var(--mono);letter-spacing:-.02em}
.statl{font:500 10px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:4px}

.tac{display:flex;gap:13px;align-items:flex-start;padding:15px 0;border-bottom:1px solid var(--line)}
.tac:last-child{border-bottom:0}
.box{width:30px;height:30px;flex:none;border:1.5px solid var(--line);border-radius:8px;background:transparent;cursor:pointer;font:700 15px/1 var(--mono);color:var(--inv)}
.box[aria-pressed="true"]{background:var(--on);border-color:var(--on)}
.tactext{font:400 15px/1.35 var(--display)}
.tacmeta{font:500 10px/1.35 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.done .item{color:var(--muted);text-decoration:line-through}

.empty{font:400 14px/1.5 var(--display);color:var(--muted);padding:18px 0;text-align:center}
.note{font:400 12px/1.4 var(--display);color:var(--muted);margin-top:8px}
.tips{margin:0;padding:0 0 0 18px}
.tips li{font:400 13px/1.5 var(--display);color:var(--muted);margin-bottom:7px}
.mset{padding:14px 0;border-bottom:1px solid var(--line)}
.mset:last-of-type{border-bottom:0}
.mgrid{display:flex;gap:10px;margin-top:12px}
.mgrid>div{flex:1;min-width:0}
.mentry{margin-top:12px}
.mentry.inline{margin-top:14px;padding:12px 13px;border-left:2px solid var(--on);background:var(--cell);border-radius:0 5px 5px 0}
.mentry.inline .item{font-size:14px;color:var(--muted)}
.mentry .tacmeta{margin-top:6px}
.mrow{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.chart{display:block;width:100%;height:70px;margin:12px 0 8px}
.gauge{display:block;width:100%;max-width:280px;margin:6px auto 0}
.mgauge{display:block;width:100%;margin:0 auto}
.mgbox{text-align:center}
.mglab{font:600 9px/1.25 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);margin-top:2px}
.mgsub{font:500 9px/1.3 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.mgrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:16px;
  margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.mgrow.wide{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.dashgrid{display:block}
.dashside{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px;margin-top:16px}
@media (min-width:1000px){
  .dashgrid{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:20px;align-items:center}
  .dashside{display:block;margin-top:0}
  .dashside .mgbox+.mgbox{margin-top:14px}
  .dashmid{min-width:0}
}
.rings{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.ringbox{width:78px;text-align:center}
.ring{display:block;width:70px;height:70px;margin:0 auto}
.ringlab{font:500 9px/1.25 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:4px;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.breakdown{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.brow{display:flex;align-items:center;gap:10px;font:500 11px/1 var(--mono);color:var(--muted);margin-top:9px}
.brow b{font:700 11px/1 var(--mono);color:var(--ink);width:38px;text-align:right}
.brow>span:first-child{width:46px;flex:none;letter-spacing:.06em;text-transform:uppercase}
.bbar{flex:1;height:6px;background:var(--track);border-radius:3px;overflow:hidden}

function testKey(thenEnable){
  if(!hasKey()||keyTest.busy)return;
  keyTest={busy:true,msg:'',ok:null}; render();
  fetch('https://api.anthropic.com/v1/messages',{

/* A tactic scores on the days it is scheduled for.
   No days set = a one-off, scored by its tick box. */
function tacticScore(w,t){
  var wk=weekOf(w), sched=t.days||[];
  if(!sched.length){var d=wk.done[t.id]?1:0;return{done:d,total:1,pct:d*100,scheduled:false}}

  return{done:hit.length,total:sched.length,pct:hit.length/sched.length*100,scheduled:true};

   with part-completed days scoring pro rata. Goal bars: mean within that goal. */
function scoreWeek(w){
  var pool=[];
  var goals=state.goals.map(function(g){
    var due=g.tactics.filter(function(t){return t.text.trim()&&t.weeks.indexOf(w)>-1});
    if(!due.length)return null;
    var sum=0;
    due.forEach(function(t){var ts=tacticScore(w,t); sum+=ts.pct; pool.push(ts.pct)});
    return{pct:sum/due.length,due:due.length};
  });
  var active=goals.filter(Boolean);
  var pct=pool.length?pool.reduce(function(a,b){return a+b},0)/pool.length:null;
  return{pct:pct,goals:goals,dueGoals:active.length,dueTotal:pool.length};
}
/* A measurement is the lag indicator: the number the work is meant to move.
   mode 'weekly' = enter what you did that week, the app accumulates.
   mode 'total'  = enter where the number stands now, carried forward. */
function measureSeries(m){
  var st=Number(m.start)||0, tg=Number(m.target)||0;
  var cum=[], entered=[], run=st, lastWeek=0;
  for(var w=1;w<=12;w++){
    var raw=(weekOf(w).measures||{})[m.id];
    var v=(raw===undefined||raw===null||raw==='')?null:Number(raw);
    entered.push(v);
    if(v!==null){lastWeek=w; run = m.mode==='total' ? v : run+v;}
    else if(m.mode==='weekly'){/* nothing added */}
    cum.push(run);
  }
  var expected=function(w){return st+(tg-st)*(w/12)};
  var current=lastWeek?cum[lastWeek-1]:st;
  var falling=tg<st;
  var due=expected(lastWeek||0);
  return{start:st,target:tg,cum:cum,entered:entered,lastWeek:lastWeek,current:current,
    expected:expected,falling:falling,
    onPace:lastWeek?(falling?current<=due:current>=due):null,
    gap:current-due,
    pctOfTarget:(tg-st)===0?null:Math.max(0,Math.min(100,(current-st)/(tg-st)*100))};
}
function tidy(n){return (Math.round(n*100)/100).toString()}

/* Rev-counter gauge: 0-100% execution, 85 marked as the line that matters. */
function gauge(pct){
  var cx=100, cy=100, r=78, W=200, H=118;
  var pt=function(v,rad){var th=Math.PI*(1-Math.max(0,Math.min(100,v))/100);
    return [(cx+rad*Math.cos(th)).toFixed(2),(cy-rad*Math.sin(th)).toFixed(2)]};
  var arc=function(v1,v2,rad,col,w,op){
    var a=pt(v1,rad), b=pt(v2,rad);
    return '<path d="M'+a[0]+' '+a[1]+' A'+rad+' '+rad+' 0 0 1 '+b[0]+' '+b[1]+
      '" fill="none" stroke="'+col+'" stroke-width="'+w+'" stroke-linecap="butt" opacity="'+op+'"/>';
  };
  var out='<svg class="gauge" viewBox="0 0 '+W+' '+H+'" aria-hidden="true">';
  out+=arc(0,60,r,'var(--off)',13,0.85);
  out+=arc(60,85,r,'var(--off)',13,0.45);
  out+=arc(85,100,r,'var(--on)',13,0.95);
  var t=pt(85,r+9), t2=pt(85,r-9);
  out+='<line x1="'+t[0]+'" y1="'+t[1]+'" x2="'+t2[0]+'" y2="'+t2[1]+'" stroke="var(--ink)" stroke-width="1.5"/>';
  var lab=pt(85,r+18);
  out+='<text x="'+lab[0]+'" y="'+lab[1]+'" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="'+
    'ui-monospace,Menlo,monospace">85</text>';
  var v=pct===null?0:pct;
  var n=pt(v,r-14), tail=pt(v,-10);
  out+='<line x1="'+tail[0]+'" y1="'+tail[1]+'" x2="'+n[0]+'" y2="'+n[1]+
    '" stroke="'+(pct===null?'var(--dim)':'var(--ink)')+'" stroke-width="3.5" stroke-linecap="round"/>';
  out+='<circle cx="'+cx+'" cy="'+cy+'" r="6" fill="var(--card)" stroke="var(--ink)" stroke-width="2.5"/>';
  out+='<text x="'+(cx-r)+'" y="'+(cy+14)+'" text-anchor="middle" font-size="9" fill="var(--dim)" font-family="ui-monospace,Menlo,monospace">0</text>';
  out+='<text x="'+(cx+r)+'" y="'+(cy+14)+'" text-anchor="middle" font-size="9" fill="var(--dim)" font-family="ui-monospace,Menlo,monospace">100</text>';
  return out+'</svg>';
}

/* A measurement as its own rev counter. Needle is how far toward target;
   the tick is where the pace line says you should be by now. */
function miniGauge(m,se,cw){
  var span=(se.target-se.start)||1;
  var val=Math.max(0,Math.min(100,(se.current-se.start)/span*100));
  var need=Math.max(0,Math.min(100,(se.expected(cw)-se.start)/span*100));
  var cx=100,cy=100,r=74,W=200,H=126;
  var pt=function(v,rad){var th=Math.PI*(1-Math.max(0,Math.min(100,v))/100);
    return [(cx+rad*Math.cos(th)).toFixed(2),(cy-rad*Math.sin(th)).toFixed(2)]};
  var arc=function(v1,v2,col,op){
    if(v2<=v1)return '';
    var a=pt(v1,r),b=pt(v2,r);
    return '<path d="M'+a[0]+' '+a[1]+' A'+r+' '+r+' 0 0 1 '+b[0]+' '+b[1]+
      '" fill="none" stroke="'+col+'" stroke-width="11" opacity="'+op+'"/>';
  };
  var behind=val<need-0.001;
  var out='<svg class="mgauge" viewBox="0 0 '+W+' '+H+'" aria-hidden="true">';
  out+=arc(0,need,'var(--off)',0.7)+arc(need,100,'var(--on)',0.85);
  var t1=pt(need,r+8),t2=pt(need,r-8);
  out+='<line x1="'+t1[0]+'" y1="'+t1[1]+'" x2="'+t2[0]+'" y2="'+t2[1]+'" stroke="var(--ink)" stroke-width="1.5"/>';
  var n=pt(val,r-14),tail=pt(val,-9);
  out+='<line x1="'+tail[0]+'" y1="'+tail[1]+'" x2="'+n[0]+'" y2="'+n[1]+
    '" stroke="'+(se.lastWeek?'var(--ink)':'var(--dim)')+'" stroke-width="3" stroke-linecap="round"/>';
  out+='<circle cx="'+cx+'" cy="'+cy+'" r="5.5" fill="var(--card)" stroke="var(--ink)" stroke-width="2.5"/>';
  out+='<text x="'+cx+'" y="'+(cy+22)+'" text-anchor="middle" font-size="21" font-family="ui-monospace,Menlo,monospace" '+
    'fill="'+(se.lastWeek?(behind?'var(--off)':'var(--on)'):'var(--dim)')+'">'+tidy(se.current)+'</text>';
  out+='</svg>';
  return '<div class="mgbox">'+out+
    '<div class="mglab">'+esc(m.name)+'</div>'+
    '<div class="mgsub">'+tidy(se.current)+' of '+tidy(m.target)+(m.unit?' '+esc(m.unit):'')+' · '+
      (se.lastWeek?(behind?'behind':'on pace'):'no entries')+'</div></div>';
}

/* Ring per goal — share of that goal's weekly execution achieved so far. */
function ring(pct,label){
  var r=26, c=2*Math.PI*r, done=pct===null?0:Math.max(0,Math.min(100,pct));
  var col=pct===null?'var(--dim)':(pct>=85?'var(--on)':'var(--off)');
  return '<div class="ringbox"><svg class="ring" viewBox="0 0 70 70" aria-hidden="true">'+
    '<circle cx="35" cy="35" r="'+r+'" fill="none" stroke="var(--track)" stroke-width="7"/>'+
    '<circle cx="35" cy="35" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="7" stroke-linecap="round"'+
    ' stroke-dasharray="'+(c*done/100).toFixed(2)+' '+c.toFixed(2)+'" transform="rotate(-90 35 35)"/>'+
    '<text x="35" y="39" text-anchor="middle" font-size="15" font-family="ui-monospace,Menlo,monospace"'+
    ' fill="var(--ink)">'+(pct===null?'—':Math.round(pct))+'</text></svg>'+
    '<div class="ringlab">'+label+'</div></div>';
}

/* Which week the plan is actually on — from the start date if set,
   otherwise the last week with anything recorded. Weeks beyond it are
   not yet scored and must not drag the average down. */
function programmeWeek(){
  var st=state.goals[0]&&state.goals[0].start;
  if(st){
    var d=new Date(st+'T00:00:00');
    if(!isNaN(d.getTime())){
      var n=Math.floor((Date.now()-d.getTime())/(7*24*3600*1000))+1;
      return Math.max(1,Math.min(12,n));
    }
  }
  var last=1;
  WEEKS.forEach(function(w){
    var wk=state.weeks[w]; if(!wk)return;
    var any=['done','days','measures','results'].some(function(k){
      return wk[k]&&Object.keys(wk[k]).length;
    });
    if(any)last=w;
  });
  return last;
}

function goalAverages(){
  var sums=state.goals.map(function(){return{t:0,n:0}});
  var cw=programmeWeek();
  WEEKS.forEach(function(w){
    if(w>cw)return;
    var sc=scoreWeek(w);
    sc.goals.forEach(function(g,gi){ if(g){sums[gi].t+=g.pct; sums[gi].n++;} });
  });
  return sums.map(function(x){return x.n?x.t/x.n:null});
}

function measureChart(m,s){
  var vals=s.cum.concat([s.start,s.target]);
  var lo=Math.min.apply(null,vals), hi=Math.max.apply(null,vals);
  if(hi===lo)hi=lo+1;
  var W=240,H=70;
  var X=function(w){return w/12*W}, Y=function(v){return H-(v-lo)/(hi-lo)*H};
  var bars='';
  for(var w=1;w<=s.lastWeek;w++){
    var good=s.falling?s.cum[w-1]<=s.expected(w):s.cum[w-1]>=s.expected(w);
    var yv=Y(s.cum[w-1]);
    bars+='<rect x="'+(X(w-1)+1.5).toFixed(1)+'" y="'+Math.min(yv,H-1).toFixed(1)+
      '" width="'+(W/12-3).toFixed(1)+'" height="'+Math.max(1,H-yv).toFixed(1)+
      '" fill="var(--'+(good?'on':'off')+')" opacity="0.9"/>';
  }
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true">'+
    bars+
    '<line x1="0" y1="'+Y(s.start).toFixed(1)+'" x2="'+W+'" y2="'+Y(s.target).toFixed(1)+
    '" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 3" vector-effect="non-scaling-stroke"/>'+
    '</svg>';
}

function measureInput(m,w,gi,inline){
  var se=measureSeries(m), raw=(weekOf(w).measures||{})[m.id];
  var need=se.expected(w), col=se.lastWeek?(se.onPace?'var(--on)':'var(--off)'):'var(--muted)';
  return '<div class="mentry'+(inline?' inline':'')+'">'+
    '<div class="item">'+esc(m.name)+'</div>'+
    '<div class="mfield">'+
      '<input type="number" inputmode="decimal" data-num="weeks.'+w+'.measures.'+m.id+'" value="'+
        (raw===undefined||raw===null?'':esc(raw))+'" placeholder="'+(m.mode==='weekly'?'this week':'total now')+'">'+
      (m.unit?'<span class="munit">'+esc(m.unit)+'</span>':'')+
    '</div>'+
    '<div class="tacmeta" style="color:'+col+'">'+tidy(se.cum[w-1])+' of '+tidy(m.target)+
      ' · pace needs '+tidy(need)+' by week '+w+'</div>'+
    '</div>';
}

function weekDates(start,w){
  if(!start)return null;
  var d=new Date(start+'T00:00:00'); if(isNaN(d))return null;
  d.setDate(d.getDate()+(w-1)*7);
  var e=new Date(d); e.setDate(e.getDate()+6);
  var f=function(x){return x.toLocaleDateString('en-GB',{day:'numeric',month:'short'})};
  return f(d)+' – '+f(e);
}

/* ---------------------------------------------------------------- storage */
var saveTimer=null;
function setStatus(t){document.getElementById('status').textContent=t}
function save(){
  setStatus('Saving');
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    try{localStorage.setItem(KEY,JSON.stringify(state));setStatus('Saved')}
    catch(e){setStatus('Storage full')}
  },400);
}
function load(){
  var raw=null;
  try{raw=localStorage.getItem(KEY)}catch(e){}
  if(!raw){setStatus('New plan');return}
  try{
    var d=JSON.parse(raw), s=blankState();
    s.vision=Object.assign(s.vision,d.vision||{});
    if(d.goals&&d.goals.length)s.goals=d.goals;
    s.weeks=d.weeks||{};
    state=s;
    s.goals.forEach(function(g){ if(!g.id)g.id=uid(); });
    // results were once an array indexed by goal position — key them by goal id
    Object.keys(s.weeks).forEach(function(w){
      var wk=s.weeks[w]; if(!wk||!wk.results)return;
      if(Array.isArray(wk.results)){
        var o={};
        wk.results.forEach(function(r,gi){ if(r&&s.goals[gi])o[s.goals[gi].id]=r; });
        wk.results=o;
      }
    });
    s.goals.forEach(function(g,gi){
      g.measures=g.measures||[];
      g.tactics=(g.tactics&&g.tactics.length?g.tactics:[blankTactic()]).map(function(t){
        t.weeks=t.weeks||[];t.days=t.days||[];return t});
      if(g.results&&(g.results.thisWeek||g.results.toDate||g.results.onPace)){
        var wk=ensureWeek(1); if(!wk.results[g.id])wk.results[g.id]=g.results;
      }
      delete g.results;
    });
    state=s; setStatus('Saved');
  }catch(e){setStatus('New plan')}
}

/* ------------------------------------------------------------------ coach */
function planBrief(){
  var cw=programmeWeek(), L=[];
  L.push('CURRENT STATE: the user is on week '+week+' of 12. By the calendar they are on week '+cw+'.');
  var scNow=scoreWeek(week);
  L.push('Week '+week+' execution: '+(scNow.pct===null?'nothing due':
    Math.round(scNow.pct)+'% across '+scNow.dueTotal+' tactic'+(scNow.dueTotal===1?'':'s')+' due')+'. Target is 85%.');
  var scores=WEEKS.map(scoreWeek).filter(function(x,i){return i<cw&&x.pct!==null});
  if(scores.length)L.push('Average execution across weeks 1-'+cw+': '+
    Math.round(scores.reduce(function(a,b){return a+b.pct},0)/scores.length)+'%.');
  if(state.vision.longTerm)L.push('LONG-TERM VISION: '+state.vision.longTerm);
  if(state.vision.threeYear)L.push('36-MONTH VISION: '+state.vision.threeYear);
  state.goals.forEach(function(g,gi){
    if(!g.title.trim()&&!g.tactics.some(function(t){return t.text.trim()}))return;
    L.push('');
    L.push('GOAL '+(gi+1)+': '+(g.title||'(untitled)')+(g.start?' (starts '+g.start+')':''));
    g.tactics.forEach(function(t){
      if(!t.text.trim())return;
      var ts=tacticScore(week,t), dueNow=t.weeks.indexOf(week)>-1;
      L.push('  - tactic: '+t.text+' | weeks due: '+(t.weeks.length===12?'every week':t.weeks.join(',')||'none')+
        ' | days: '+((t.days||[]).length?t.days.map(function(i){return DAY_NAMES[i]}).join('/'):'one-off')+
        (dueNow?' | THIS WEEK: '+(ts.scheduled?ts.done+' of '+ts.total+' days done':(ts.pct===100?'done':'not done')):' | not due this week'));
    });
    (g.measures||[]).forEach(function(m){
      if(!m.name.trim())return;
      var se=measureSeries(m);
      L.push('  - measurement: '+m.name+' | at '+tidy(se.current)+' of '+tidy(m.target)+' '+(m.unit||'')+
        ' | last entry was week '+(se.lastWeek||'none')+
        (se.lastWeek?', where the pace line wanted '+tidy(se.expected(se.lastWeek))+
          ' — '+(se.onPace?'ON pace':'BEHIND pace')+' by '+tidy(Math.abs(se.gap)):'')+
        ' | needs '+tidy(se.expected(cw))+' by the end of week '+cw+' and '+tidy(m.target)+' by week 12'+
        ' | entered as '+(m.mode==='weekly'?'weekly amounts that accumulate':'a running total'));
    });
    var r=resultOf(week,g.id);
    if(r.thisWeek||r.toDate||r.onPace)L.push('  - notes wk'+week+': this week "'+r.thisWeek+'", to date "'+r.toDate+'", on pace: '+(r.onPace||'not said'));
  });
  return L.join('\n');
}

function coachSystem(){
  var where={week:'the Week tab, where they tick tactics and enter this week\'s numbers',
    plan:'the Plan tab, where they write goals, tactics, weeks due, day patterns and measurements',
    score:'the Score tab, showing the execution gauge, per-goal rings, the 12-week strip and measurement pace charts',
    vision:'the Vision tab, for the long-term and 36-month vision'}[view]||'the app';
  var L=[
    'You are the coach inside a 12 Week Year execution tracker that this person built for themselves. British English. Direct, warm, unsentimental. No preamble, no flattery.',
    'You are looking at the same data they are, on '+where+'.',
    '',
    'THE 12 WEEK YEAR, PROPERLY UNDERSTOOD:',
    '- A twelve-week cycle is treated as a full year. Twelve weeks is long enough to achieve something real and short enough that every week counts. There is no "later" in a twelve-week year.',
    '- The chain runs: long-term vision -> 36-month vision -> a small number of 12-week goals -> weekly tactics -> today. Each link must serve the one above it. A goal that serves no vision is just activity.',
    '- Lead and lag: execution is the lead measure (what they control, scored weekly); results are the lag measure (what follows). Score the lead honestly and the lag tends to arrive.',
    '- 85% execution is the standard. Not 100% — that invites lying to yourself. Not 60% — that is a plan nobody is running.',
    '- Intentional imbalance is fine for twelve weeks. Something gets less attention on purpose; that is a choice, not a failure.',
    '- Common failure is not laziness. It is a plan with too many goals, tactics written as hopes rather than actions, and no weekly accountability moment.',
    '',
    'HOW THIS APP SCORES: every tactic due this week counts once, pooled across all goals. A tactic with days set scores days-done over days-scheduled, so part credit is real. A one-off scores done or not done. Target 85%.',
    'Measurements are the lag indicator and deliberately do NOT feed the execution score. Never suggest otherwise.',
    'Never invent numbers. Everything you know about their plan is below; if something is missing, ask for it.',
    'Ask ONE question per reply when you are drawing something out of them. Keep replies to a few short paragraphs unless depth is asked for.',
    ''
  ];
  L=L.concat(STANCE[view]||[]);
  if(guide)L.push('','THEY ARE IN THE GUIDED FLOW right now, on the step: "'+guide.flow+' / '+(guide.label||'')+'". Help them answer just that step. Do not race ahead.');
  L.push('','--- THEIR PLAN AND CURRENT POSITION ---',planBrief());
  return L.join('\n');
}

function sendCoach(){
  var text=(coachDraft||'').trim();
  if(!text||coachBusy)return;
  if(!coachReady()){coachError='The coach needs a working API key.';render();return}
  chat.push({role:'user',content:text});
  coachDraft=''; coachBusy=true; coachError=''; saveChat(); render();
  fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'content-type':'application/json','x-api-key':prefs.apiKey,
      'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:prefs.model||'claude-sonnet-5',max_tokens:1200,
      system:coachSystem(),
      messages:chat.slice(-16).map(function(m){return{role:m.role,content:m.content}})})
  }).then(function(r){
    return r.json().then(function(j){
      if(!r.ok){
        var err=new Error((j&&j.error&&j.error.message)||('HTTP '+r.status));
        if(r.status===401)err.authFail=true;
        throw err;
      }
      return j;
    });
  }).then(function(j){
    var txt=(j.content||[]).map(function(c){return c.type==='text'?c.text:''}).filter(Boolean).join('\n');
    chat.push({role:'assistant',content:txt||'(no reply)'});
  })['catch'](function(e){
    if(e.authFail){
      prefs.keyOk=false; savePrefs();
      keyTest={busy:false,ok:false,msg:'Your key stopped working mid-conversation — expired or revoked. The rest of the app carries on as normal.'};
      prefs.layout='full'; prefs.prevLayout='full'; savePrefs(); splash=true;
      coachError='';
    } else {
      coachError=e.message||'Could not reach the API.';
    }
  }).then(function(){
    coachBusy=false; saveChat(); render();
    var log=document.getElementById('coachlog'); if(log)log.scrollTop=log.scrollHeight;
  });
}

function renderCoach(){
  var out='<div class="coachhead"><span class="coachtitle">Coach</span>'+
    (guide?'<button class="btn ghost" data-act="gresume">\u2039 Back to the guide</button>':
      (chat.length?'<button class="btn ghost" data-act="coachclear">Clear</button>':''))+'</div>';

  } else if(!chat.length){

      'I can see your goals, tactics, this week\'s ticks and your measurements. Ask me anything about the plan or the week.</div></div>';
  }
  chat.forEach(function(m,i){
    out+='<div class="msg '+(m.role==='user'?'me':'ai')+'"><span class="who">'+(m.role==='user'?'You':'Coach')+
      (m.role==='assistant'&&speechOn()?'<button class="minispk" data-act="sayone" data-i="'+i+'">'+
        (isSaying()?'stop':'listen')+'</button>':'')+
      '</span><div class="bubble">'+esc(m.content)+'</div></div>';
  });
  if(coachBusy)out+='<div class="msg ai"><span class="who">Coach</span><div class="bubble" style="color:var(--muted)">Thinking…</div></div>';
  if(coachError)out+='<div class="msg ai"><span class="who">Problem</span><div class="bubble" style="color:var(--off)">'+esc(coachError)+'</div></div>';
  out+='</div>';
  out+='<div class="coachform">';
  if(coachReady()&&!chat.length){
    out+='<div class="prompts">'+(COACH_PROMPTS[view]||COACH_PROMPTS.coach).map(function(q){
      return '<button class="chip" data-act="coachask" data-v="'+esc(q)+'">'+esc(q)+'</button>';
    }).join('')+'</div>';
  }
  out+='<textarea id="coachin" placeholder="Ask the coach…">'+esc(coachDraft)+'</textarea>'+
    '<div class="coachrow"><button class="btn solid" data-act="coachsend"'+(coachBusy?' disabled':'')+'>Send</button>'+
    '<span class="note" style="margin:0;align-self:center">Sees your plan and this week</span></div></div>';
  return out;
}

/* ------------------------------------------------------------------ guide */
var FOCI=['Work','Money','Health','Relationships','Learning','Craft','Something else'];

function guideSteps(flow){
  var st=[];
  if(flow==='vision'){
    st.push({id:'focus',label:'What this is for',
      q:'Which part of your life is this twelve weeks really about?',
      hint:'Pick the one that matters most right now. Intentional imbalance is fine — the others are not being abandoned, just not the point of this cycle.',
      chips:{path:'vision.focus',options:FOCI}});
    st.push({id:'lt',label:'Long-term vision',
      q:'Where do you want to be in five, ten, fifteen years?',
      hint:'Write it as though it has already happened. If you are stuck, ask the coach — it will start you somewhere smaller than this question.',
      area:{path:'vision.longTerm'}});
    st.push({id:'age',label:'Your age in three years',
      q:'How old will you be in three years?',
      hint:'Naming the age makes the three-year vision a real moment rather than an abstraction.',
      num:{path:'vision.age'}});
    st.push({id:'m36',label:'36-month vision',
      q:'Three years from now, what is true?',
      hint:'This is a waypoint on the road to the long-term vision above, not a separate ambition. Same direction, nearer.',
      area:{path:'vision.threeYear'},show:'lt'});
    st.push({id:'link',label:'Do they line up?',
      q:'Read both back. Does the three-year picture actually move you toward the long one?',
      hint:'If they point different ways, one of them is drifting. The coach will tell you which if you ask it.',
      review:true});
  }
  if(flow==='plan'){
    st.push({id:'count',label:'How many goals',
      q:'How many goals for these twelve weeks?',
      hint:'Fewer achieved beats more neglected. Three is plenty. One is not too few.',
      count:true});
    state.goals.forEach(function(g,gi){
      st.push({id:'g'+gi+'-title',label:'Goal '+(gi+1),gi:gi,
        q:'What is goal '+(gi+1)+'?',
        hint:'Specific, measurable, finished inside twelve weeks. "Hand over 16 projects by week 12" — not "improve handovers".',
        input:{path:'goals.'+gi+'.title'}});
      if(gi===0)st.push({id:'start',label:'Start date',gi:gi,
        q:'Which Monday does week 1 begin?',
        hint:'This drives the week counter and every pace calculation.',
        date:{path:'goals.0.start'}});
      g.tactics.forEach(function(t,ti){
        st.push({id:'g'+gi+'t'+ti+'-text',label:'Tactic '+(ti+1)+', goal '+(gi+1),gi:gi,ti:ti,
          q:'What action will move goal '+(gi+1)+'?',
          hint:'An action you control, answerable yes or no at the end of a day.',
          input:{path:'goals.'+gi+'.tactics.'+ti+'.text'}});
        st.push({id:'g'+gi+'t'+ti+'-weeks',label:'Weeks due',gi:gi,ti:ti,
          q:'Which weeks does it fall due?',
          hint:'Tap All if it runs every week.',
          weeks:{gi:gi,ti:ti}});
        st.push({id:'g'+gi+'t'+ti+'-days',label:'Days each week',gi:gi,ti:ti,
          q:'Which days, in each of those weeks?',
          hint:'Choosing days gives you part credit — four of five days scores 80%. Once means done or not done.',
          days:{gi:gi,ti:ti}});
      });
      st.push({id:'g'+gi+'-more',label:'Another tactic?',gi:gi,
        q:'Another tactic for goal '+(gi+1)+'?',
        hint:'Enough tactics that the goal would land if you did them all. No more than that.',
        more:{gi:gi}});
      (g.measures||[]).forEach(function(m,mi){
        st.push({id:'g'+gi+'m'+mi,label:'Measurement',gi:gi,mi:mi,
          q:'What number should this goal move?',
          hint:'The result the work is meant to produce. It is tracked and charted, but never scored — execution stays the thing you control.',
          measure:{gi:gi,mi:mi}});
      });
      if(!(g.measures||[]).length)st.push({id:'g'+gi+'-maskip',label:'Add a measurement?',gi:gi,
        q:'Add a measurement to goal '+(gi+1)+'?',
        hint:'Optional, but it is what turns "I did the work" into "and here is what it produced".',
        addm:{gi:gi}});
    });
    st.push({id:'done',label:'Ready',q:'That is the plan.',hint:'You can change any of it later in the Plan tab.',finish:true});
  }
  if(flow==='week'){
    var sc=scoreWeek(week);
    state.goals.forEach(function(g,gi){
      g.tactics.forEach(function(t,ti){
        if(!t.text.trim()||t.weeks.indexOf(week)<0)return;
        st.push({id:'w'+t.id,label:'Goal '+(gi+1),gi:gi,
          q:t.text,
          hint:(t.days||[]).length?'Tap the days you did it.':'Did you do it this week?',
          tick:{gi:gi,tid:t.id}});
      });
      (g.measures||[]).filter(function(m){return m.name.trim()&&!m.tacticId}).forEach(function(m,k){
        st.push({id:'wm'+m.id,label:'Goal '+(gi+1)+' measurement',gi:gi,
          q:m.name,hint:m.mode==='weekly'?'What did you do this week?':'Where does the total stand now?',
          mentry:{gi:gi,mid:m.id}});
      });
      var due=g.tactics.filter(function(t){return t.text.trim()&&t.weeks.indexOf(week)>-1});
      if(due.length)st.push({id:'wn'+gi,label:'Goal '+(gi+1)+' notes',gi:gi,
        q:'What actually happened on goal '+(gi+1)+' this week?',
        hint:'One line is enough. This is what you will read back next week.',
        notes:{gi:gi}});
    });
    st.push({id:'wdone',label:'Week scored',q:'Week '+week+' logged.',hint:'',finish:true,score:true});
  }
  return st;
}

function renderGuide(){
  var steps=guideSteps(guide.flow);
  if(!steps.length){guide=null;return renderVision()}
  if(guide.i>=steps.length)guide.i=steps.length-1;
  var st=steps[guide.i];
  guide.label=st.label;
  var pc=Math.round((guide.i+1)/steps.length*100);
  return '<div class="gwrap">'+
    '<div class="gtop"><button class="btn ghost" data-act="gexit">Exit</button>'+
      '<span class="gcount">'+(guide.i+1)+' / '+steps.length+'</span></div>'+
    '<div class="gprog"><i style="width:'+pc+'%"></i></div>'+
    '<div class="glabel">'+esc(st.label||'')+'</div>'+
    '<h3 class="gq">'+esc(st.q)+'</h3>'+
    (st.hint?'<p class="ghint">'+esc(st.hint)+'</p>':'')+

      (guide.i>0?'<button class="btn" data-act="gback">Back</button>':'<span></span>')+

      (st.finish?'<button class="btn solid" data-act="gexit">Finish</button>'
               :'<button class="btn solid" data-act="gnext">Next</button>')+

}

/* ------------------------------------------------------------------ speech */
var spk={segs:[],i:0,playing:false,paused:false,token:0};
var vuTimer=null;
function IC2(d){return '<svg class="dic" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" '+
  'stroke-width="1.6" stroke-linejoin="round" aria-hidden="true">'+d+'</svg>'}
function DECKIC(k){return{
  prev:IC2('<path d="M18 5v14L8 12z"/><path d="M6 5v14"/>'),
  next:IC2('<path d="M6 5v14l10-7z"/><path d="M18 5v14"/>'),
  play:IC2('<path d="M7 4v16l13-8z"/>'),
  pause:IC2('<path d="M8 5v14M16 5v14"/>'),
  stop:IC2('<rect x="6.5" y="6.5" width="11" height="11" rx="1"/>')
}[k]}
/* built lazily — IC is defined further down the file */
function SPK(){return IC('<path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M16 8.5a4 4 0 0 1 0 7"/><path d="M18.5 6a7 7 0 0 1 0 12"/>')}
function STOPIC(){return IC('<rect x="6" y="6" width="12" height="12" rx="1.5"/>')}

function speechOn(){return !!(window.speechSynthesis&&window.SpeechSynthesisUtterance)}
/* split into sentences so the deck can step through them */
function segment(text){
  var t=String(text||'').replace(/\s+/g,' ').trim(), out=[], buf='';
  for(var i=0;i<t.length;i++){
    buf+=t.charAt(i);
    if('.!?'.indexOf(t.charAt(i))>-1&&(t.charAt(i+1)===' '||i===t.length-1)){
      if(buf.trim().length>1)out.push(buf.trim());
      buf='';
    }
  }
  if(buf.trim())out.push(buf.trim());
  return out.length?out:[t];
}
function startVU(){
  if(vuTimer||!document.querySelectorAll)return;
  vuTimer=setInterval(function(){
    var bars=document.querySelectorAll('.vu i');
    for(var i=0;i<bars.length;i++){
      var h=(spk.playing&&!spk.paused)?(12+Math.random()*Math.random()*95):5;
      bars[i].style.height=Math.min(100,h).toFixed(0)+'%';
    }
  },110);
}
function stopVU(){
  if(vuTimer){clearInterval(vuTimer);vuTimer=null}
  if(!document.querySelectorAll)return;
  var bars=document.querySelectorAll('.vu i');
  for(var i=0;i<bars.length;i++)bars[i].style.height='5%';
}
function isSaying(){return spk.playing&&!spk.paused}
function stopSpeech(){
  if(!speechOn())return;
  spk.token++; window.speechSynthesis.cancel();
  spk.playing=false; spk.paused=false; spk.i=0; spk.segs=[];
  stopVU();
}
function playFrom(i){
  if(!speechOn()||!spk.segs.length)return;
  spk.token++;
  var tok=spk.token;
  window.speechSynthesis.cancel();
  spk.i=Math.max(0,Math.min(i,spk.segs.length-1));
  var u=new window.SpeechSynthesisUtterance(spk.segs[spk.i]);
  u.lang='en-GB'; u.rate=1; u.pitch=1;
  var vs=window.speechSynthesis.getVoices()||[];
  for(var v=0;v<vs.length;v++){ if(/en[-_]GB/i.test(vs[v].lang)){u.voice=vs[v];break} }
  u.onend=function(){
    if(tok!==spk.token)return;
    if(spk.i<spk.segs.length-1){playFrom(spk.i+1)}
    else {spk.playing=false; stopVU(); render()}
  };
  u.onerror=function(){ if(tok!==spk.token)return; spk.playing=false; stopVU(); render() };
  spk.playing=true; spk.paused=false;
  window.speechSynthesis.speak(u);
  startVU(); render();
}
function speak(text){
  if(!speechOn()||!text)return;
  spk.segs=segment(text); playFrom(0);
}
function togglePlay(){
  if(!speechOn())return;
  if(!spk.segs.length){speakCurrent();return}
  if(isSaying()){
    try{window.speechSynthesis.pause()}catch(e){}
    spk.paused=true; stopVU(); render(); return;
  }
  if(spk.paused){
    var resumed=false;
    try{window.speechSynthesis.resume(); resumed=true}catch(e){}
    if(resumed&&window.speechSynthesis.speaking){spk.paused=false; startVU(); render()}
    else {playFrom(spk.i)}
    return;
  }
  playFrom(spk.i);
}
function vuBank(){
  var b=''; for(var i=0;i<7;i++)b+='<i style="height:5%"></i>';
  return '<span class="vu">'+b+'</span>';
}
function transport(label){
  if(!speechOn())return '';
  if(!coachReady())return sayBtn(label);
  var pos=spk.segs.length?(spk.i+1)+' / '+spk.segs.length:'Read';
  return '<div class="deck'+(isSaying()?' live':'')+'">'+
    vuBank()+
    '<button data-act="spkprev" aria-label="Back one" title="Back one">'+DECKIC('prev')+'</button>'+
    '<button data-act="spktoggle" class="big" aria-label="Play or pause">'+
      DECKIC(isSaying()?'pause':'play')+'</button>'+
    '<button data-act="spkstop" aria-label="Stop">'+DECKIC('stop')+'</button>'+
    '<button data-act="spknext" aria-label="Forward one" title="Forward one">'+DECKIC('next')+'</button>'+
    vuBank()+'<span class="deckpos">'+pos+'</span></div>';
}
function sayBtn(label){
  if(!speechOn())return '';
  return '<button class="speak" data-act="say" aria-pressed="'+isSaying()+'">'+
    (isSaying()?STOPIC()+'<span>Stop</span>':SPK()+'<span>'+(label||'Listen')+'</span>')+'</button>';
}
function pct(n){return n===null||n===undefined?'not scored':Math.round(n)+' percent'}

function spokenVision(){
  var v=state.vision,L=[];
  L.push('Your vision.');
  if(v.focus)L.push('This cycle is about '+v.focus+'.');
  L.push(v.longTerm?'Long term vision. '+v.longTerm:'You have not written a long term vision yet. This is the hardest part, and the coach can talk you into it.');
  if(v.age)L.push('In three years you will be '+v.age+'.');
  L.push(v.threeYear?'Thirty six month vision. '+v.threeYear:'You have not written a thirty six month vision yet. It should be a waypoint on the road to your long term one.');
  return L.join(' ');

function spokenPlan(){
  var L=['Your plan. '+state.goals.length+' goal'+(state.goals.length===1?'':'s')+'.'];
  state.goals.forEach(function(g,gi){
    L.push('Goal '+(gi+1)+'. '+(g.title||'not yet written')+'.');
    var ts=g.tactics.filter(function(t){return t.text.trim()});
    if(!ts.length){L.push('No tactics yet.');return}
    ts.forEach(function(t){
      L.push(t.text+', due '+(t.weeks.length===12?'every week':(t.weeks.length?'weeks '+t.weeks.join(', '):'no weeks set'))+
        ', '+((t.days||[]).length?'on '+t.days.map(function(i){return DAY_NAMES[i]}).join(', '):'as a one off')+'.');
    });
    (g.measures||[]).forEach(function(m){
      if(m.name.trim())L.push('Measured by '+m.name+', from '+tidy(m.start)+' to '+tidy(m.target)+' '+(m.unit||'')+'.');
    });
  });
  return L.join(' ');
}
function spokenWeek(){
  var sc=scoreWeek(week), L=['Week '+week+' of 12.'];
  var d=weekDates(state.goals[0].start,week); if(d)L.push(d.replace('–','to')+'.');
  L.push(sc.pct===null?'Nothing due this week.':'Execution '+pct(sc.pct)+', against a target of 85. '+
    sc.dueTotal+' tactic'+(sc.dueTotal===1?'':'s')+' due.');
  state.goals.forEach(function(g,gi){
    var due=g.tactics.filter(function(t){return t.text.trim()&&t.weeks.indexOf(week)>-1});
    if(!due.length)return;
    L.push('Goal '+(gi+1)+', '+(g.title||'untitled')+'.');
    due.forEach(function(t){
      var ts=tacticScore(week,t);
      L.push(t.text+': '+(ts.scheduled?ts.done+' of '+ts.total+' days done':(ts.pct===100?'done':'not done yet'))+'.');
    });
    (g.measures||[]).forEach(function(m){
      if(!m.name.trim())return;
      var se=measureSeries(m);
      L.push(m.name+': at '+tidy(se.cum[week-1])+' of '+tidy(m.target)+
        ', pace needs '+tidy(se.expected(week))+' by the end of this week.');
    });
  });
  return L.join(' ');
}
function spokenScore(){
  var cw=programmeWeek(), sc=WEEKS.map(scoreWeek).filter(function(x,i){return i<cw&&x.pct!==null});
  var avg=sc.length?sc.reduce(function(a,b){return a+b.pct},0)/sc.length:null;
  var hit=sc.filter(function(x){return x.pct>=85}).length;
  var L=['Your execution.'];
  L.push(avg===null?'No weeks scored yet.':'Average execution '+pct(avg)+' across weeks 1 to '+cw+'. '+
    hit+' week'+(hit===1?'':'s')+' at 85 percent or better.');
  var ga=goalAverages();
  state.goals.forEach(function(g,gi){
    if(ga[gi]===null)return;
    L.push('Goal '+(gi+1)+', '+(g.title||'untitled')+', averaging '+pct(ga[gi])+'.');
  });
  state.goals.forEach(function(g,gi){
    (g.measures||[]).forEach(function(m){
      if(!m.name.trim())return;
      var se=measureSeries(m);
      L.push(m.name+': '+tidy(se.current)+' of '+tidy(m.target)+' '+(m.unit||'')+', '+
        (se.onPace===null?'nothing entered yet':(se.onPace?'ahead of pace by '+tidy(Math.abs(se.gap)):'behind pace by '+tidy(Math.abs(se.gap))))+'.');
    });
  });
  return L.join(' ');
}

        '<span class="chev">\u203A</span>'+
      '</button>'+
      '<div class="secbar"><i style="width:'+(gs?gs.pct:0)+'%;background:'+(gs?(gs.pct>=85?'var(--on)':'var(--off)'):'transparent')+'"></i></div>';

function renderScore(){
  var scores=WEEKS.map(scoreWeek);
  var cw=programmeWeek();
  var scored=scores.filter(function(s,i){return i<cw&&s.pct!==null});
  var avg=scored.length?Math.round(scored.reduce(function(a,b){return a+b.pct},0)/scored.length):null;
  var hit=scored.filter(function(s){return s.pct>=85}).length;
  var cwx=programmeWeek(), ms=[];
  state.goals.forEach(function(g){(g.measures||[]).forEach(function(m){
    if(m.name.trim())ms.push({m:m,se:measureSeries(m)});
  })});
  var flank=ms.length>0&&ms.length<=6&&ms.length%2===0;
  var half=flank?ms.length/2:0;
  var mg=function(a,b){return ms.slice(a,b).map(function(x){return miniGauge(x.m,x.se,cwx)}).join('')};

  var out='<div class="card"><label class="lbl">Average execution</label>'+
    (flank?'<div class="dashgrid"><div class="dashside">'+mg(0,half)+'</div><div class="dashmid">':'')+
    gauge(avg)+
    '<div style="text-align:center;margin-top:-6px">'+
    '<div class="statv" style="font-size:34px;color:'+(avg===null?'var(--dim)':(avg>=85?'var(--on)':'var(--off)'))+'">'+
      (avg===null?'—':avg+'%')+'</div>'+
    '<div class="statl">'+(avg===null?'No weeks scored yet':
      ('weeks 1–'+cw+' · '+scored.length+' scored · '+hit+' at 85%+'))+'</div></div>';
  if(flank)out+='</div><div class="dashside">'+mg(half,ms.length)+'</div></div>';
  if(!flank&&ms.length)out+='<div class="mgrow'+(ms.length<=3?' wide':'')+'">'+mg(0,ms.length)+'</div>';
  var ga=goalAverages();
  if(ga.some(function(x){return x!==null})){
    out+='<div class="rings">'+state.goals.map(function(g,gi){
      return ring(ga[gi], esc(g.title||('Goal '+(gi+1))));
    }).join('')+'</div>';
  }
  out+='</div>';

  out+='<div class="card"><label class="lbl">Weekly execution — tap a week</label><div class="strip"><div class="target"><span>85%</span></div>';
  scores.forEach(function(s,i){
    out+='<button class="cell" aria-current="'+(i+1===week)+'" data-act="gow" data-w="'+(i+1)+'" aria-label="Week '+(i+1)+(s.pct===null?', not scored':', '+Math.round(s.pct)+' percent')+'">'+
      (s.pct!==null&&s.pct>0?'<span class="fill'+(s.pct<85?' low':'')+'" style="height:'+s.pct+'%"></span>':'')+
      '<span class="cellnum">'+(i+1)+'</span></button>';
  });
  out+='</div></div>';

  out+='<h2>Goals</h2>';
  state.goals.forEach(function(g,gi){
    var p=latestOnPace(g.id);
    out+='<div class="card"><div class="tactext">'+esc(g.title||'Goal '+(gi+1)+' not set')+'</div>'+
      '<div class="tacmeta">'+g.tactics.filter(function(t){return t.text.trim()}).length+' tactics'+
      (p?' · on pace at week '+p.week+': '+p.value.toLowerCase():'')+'</div></div>';
  });

  var anyM=false;
  state.goals.forEach(function(g){(g.measures||[]).forEach(function(m){if(m.name.trim())anyM=true})});
  if(anyM){
    out+='<h2>Results</h2>';
    state.goals.forEach(function(g,gi){
      (g.measures||[]).forEach(function(m){
        if(!m.name.trim())return;
        var se=measureSeries(m);
        var col=se.onPace===null?'var(--dim)':(se.onPace?'var(--on)':'var(--off)');
        out+='<div class="card">'+
          '<div style="display:flex;align-items:baseline;justify-content:space-between">'+
          '<span class="lbl" style="margin-bottom:0">'+esc(m.name)+'</span>'+
          '<span class="statv" style="color:'+col+'">'+tidy(se.current)+'</span></div>'+
          '<div class="statl" style="margin-top:6px">of '+tidy(se.target)+(m.unit?' '+esc(m.unit):'')+
            ' · goal '+(gi+1)+
            (se.lastWeek?' · '+(se.gap===0?'exactly on pace':(se.onPace?'ahead by ':'behind by ')+tidy(Math.abs(se.gap))):' · no entries yet')+
          '</div>'+
          '<div class="bbar" style="margin-top:12px"><i style="width:'+(se.pctOfTarget===null?0:se.pctOfTarget.toFixed(1))+
            '%;background:'+col+'"></i></div>'+
          measureChart(m,se)+
          '<div class="statl">Dashed line is the pace needed to reach your target by week 12.</div>'+
          '</div>';
      });
    });
  }

  out+='<h2>Appearance</h2><div class="card">'+
    '<label class="lbl">Colour</label>'+chips(THEME_ORDER.map(function(k){
      return chip(THEMES[k].name,theme.preset===k,'data-act="theme" data-v="'+k+'"');
    }).join(''))+
    '<label class="lbl" style="margin-top:14px">Mode</label>'+chips(MODES.map(function(m){
      return chip(m[1],theme.mode===m[0],'data-act="mode" data-v="'+m[0]+'"');
    }).join(''))+
    '<div class="note">Auto follows your iPhone\'s light and dark setting.</div></div>';

  out+='<h2>Your data</h2><div class="card"><div class="note" style="margin:0 0 12px">'+
    'Everything is stored on this device only. Export a copy before clearing your browser data or changing phone.</div>'+
    '<button class="btn" data-act="export">Export backup</button> '+
    '<button class="btn" data-act="import">Import backup</button>'+
    '<div class="note" style="margin-top:14px">Coach API key — stored on this device only. '+
      (!hasKey()?'None set.':(prefs.keyOk===true?'Checked and working.':
        prefs.keyOk===false?'Rejected — expired, revoked or mistyped.':'Not checked yet.'))+'</div>'+
    '<input type="text" data-bind="__key" value="'+esc(prefs.apiKey)+'" placeholder="sk-ant-...">'+
    '<label class="lbl" style="margin-top:12px">Model</label>'+
    '<input type="text" data-bind="__model" value="'+esc(prefs.model)+'">'+
    '<button class="btn ghost" data-act="keytest"'+((hasKey()&&!keyTest.busy)?'':' disabled')+'>'+
      (keyTest.busy?'Checking…':'Test the key')+'</button>'+
    (keyTest.msg?'<div class="note keyres'+(keyTest.ok===false?' bad':(keyTest.ok?' good':''))+'">'+esc(keyTest.msg)+'</div>':'')+
    '<div class="note" style="margin-top:14px">Version '+APP_VERSION+'. Updates arrive on their own; this forces the check.</div>'+
    '<button class="btn ghost" data-act="update">Check for updates now</button></div>'+
    '<hr><button class="btn" data-act="reset">Start a new 12 weeks</button>';
  return out;
}

var TABS=[['week','Week'],['plan','Plan'],['score','Score'],['vision','Vision']];
var LAYOUTS=[['split','Split'],['coach','Coach only'],['full','Full screen']];
var IC=function(d){return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" '+
  'stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+d+'</svg>'};
var ICONS={
  week:IC('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/><path d="M9 15l2 2 4-4"/>'),
  plan:IC('<path d="M4 6h10M4 12h16M4 18h7"/><circle cx="19" cy="6" r="2"/><circle cx="14" cy="18" r="2"/>'),
  score:IC('<path d="M3 17a9 9 0 0 1 18 0"/><path d="M12 17l5-5"/><circle cx="12" cy="17" r="1.6"/>'),
  vision:IC('<path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="2.6"/>'),
  coach:IC('<path d="M21 12a8 8 0 0 1-8 8H8l-4 3v-5.5A8 8 0 1 1 21 12z"/><path d="M9 11h6M9 15h3"/>'),
  guide:IC('<path d="M5 4h9l5 5v11H5z"/><path d="M14 4v5h5"/><path d="M9 13h6M9 17h4"/>')
};
function render(){
  var main=document.getElementById('app');
  var y=main.scrollTop;
  var t={week:'Week '+week,plan:'The plan',score:'Execution',vision:'My vision'}[view];
  var start=state.goals[0].start;
  var sub={
    week:weekDates(start,week)||'Tick tactics as you finish them.',
    plan:'Goals, their tactics, the weeks they fall due and the days in each week.',
    score:'Execution is the score that predicts the result.',
    vision:'Where this is all pointing.'
  }[view];
  if(view==='week'&&openGoal===null){
    var scq=scoreWeek(week), pick='';
    state.goals.forEach(function(g,gi){
      if(pick)return;
      if(scq.goals[gi]&&scq.goals[gi].pct<100)pick=g.id;
    });
    openGoal=pick||(state.goals[0]?state.goals[0].id:'');
  }
  document.getElementById('eyebrow').textContent='12 Week Year · v'+APP_VERSION;
  document.getElementById('title').textContent=t;
  document.getElementById('sub').textContent=sub;
  document.getElementById('hact').innerHTML=transport('Read this page');
  try{
    main.innerHTML= splash ? renderSplash() : guide ? renderGuide() :
      view==='week'?renderWeek():view==='plan'?renderPlan():view==='score'?renderScore():renderVision();
  }catch(err){
    main.innerHTML='<div class="card"><label class="lbl">Something went wrong</label>'+
      '<div class="note">'+esc(err&&err.message||err)+'</div></div>';
  }
  var onCoach=prefs.layout==='coach';
  var lock=!coachReady();
  document.getElementById('nav').innerHTML=TABS.map(function(x){
    return '<button data-act="tab" data-v="'+x[0]+'" aria-current="'+(!onCoach&&view===x[0])+'">'+
      ICONS[x[0]]+'<span>'+x[1]+'</span></button>';
  }).join('')+
    '<button data-act="'+(lock?'splash':'lay')+'" data-v="coach" aria-current="'+onCoach+'"'+
    (lock?' class="locked"':'')+'>'+ICONS.coach+'<span>Coach</span></button>';

  document.getElementById('modes').innerHTML=
    TABS.map(function(x){
      return '<button data-act="tab" data-v="'+x[0]+'" aria-current="'+(!onCoach&&view===x[0])+'">'+
        ICONS[x[0]]+'<span>'+x[1]+'</span></button>';
    }).join('')+'<span class="spacer"></span>'+
    '<button data-act="'+(lock?'splash':'lay')+'" data-v="coach" aria-current="'+onCoach+'"'+
    (lock?' class="locked"':'')+'>'+ICONS.coach+'<span>Coach</span></button>';

  document.getElementById('laybox').innerHTML=
    '<span class="lbl">Layout</span>'+
    LAYOUTS.map(function(l){
      var needsKey=l[0]!=='full', off=needsKey&&lock;
      return '<button class="radio'+(off?' locked':'')+'" role="radio" aria-checked="'+(prefs.layout===l[0])+
        '" data-act="'+(off?'splash':'lay')+'" data-v="'+l[0]+'"><i></i>'+l[1]+(off?'<em>key</em>':'')+'</button>';
    }).join('')+
    (lock?'<button class="btn ghost" style="margin-top:6px" data-act="splash">Why coach?</button>'
        :'<button class="btn ghost" style="margin-top:8px" data-act="side">Switch sides</button>')+
    '<span class="lbl" style="margin-top:14px;display:block">Colour</span>'+
    '<div class="swatches">'+THEME_ORDER.map(function(k){
      var pal=THEMES[k][darkNow()?'dark':'light'];
      return '<button class="sw" data-act="theme" data-v="'+k+'" aria-pressed="'+(theme.preset===k)+
        '" title="'+THEMES[k].name+'"><span style="background:'+pal.ink+'"></span>'+
        '<span style="background:'+pal.on+'"></span></button>';
    }).join('')+'</div>'+
    '<div class="modeswitch">'+MODES.map(function(m){
      return '<button data-act="mode" data-v="'+m[0]+'" aria-pressed="'+(theme.mode===m[0])+'">'+m[1]+'</button>';
    }).join('')+'</div>'+
    '<div class="note" style="margin-top:10px">v'+APP_VERSION+'</div>';

  var b=document.body;
  b.className=('lay-'+prefs.layout)+(prefs.coachSide==='left'?' side-left':'')+
    (onCoach?' mob-coach':'')+(((guide||splash)&&!onCoach)?' guiding':'');
  document.getElementById('coach').innerHTML=renderCoach();
  main.scrollTop=y;
}

/* ------------------------------------------------------------------ events */
function setPath(path,value){
  var parts=path.split('.'), o=state;
  if(parts[0]==='weeks')ensureWeek(parseInt(parts[1],10));
  if(parts[0]==='weeks'&&parts[2]==='measures')ensureWeek(parseInt(parts[1],10)).measures=ensureWeek(parseInt(parts[1],10)).measures||{};
  for(var i=0;i<parts.length-1;i++){
    var k=parts[i];
    if(o[k]==null)o[k]={};
    o=o[k];
  }
  o[parts[parts.length-1]]=value;
}
document.addEventListener('input',function(e){
  if(e.target.id==='coachin'){coachDraft=e.target.value;return}
  var p=e.target.getAttribute&&e.target.getAttribute('data-bind');
  if(!p)return;
  if(p==='__key'){
    prefs.apiKey=e.target.value.trim();
    prefs.keyOk=null; keyTest={busy:false,msg:'',ok:null};
    savePrefs();
    ['[data-act="spenable"]','[data-act="keytest"]'].forEach(function(sel){
      var btn=document.querySelector(sel); if(btn)btn.disabled=!hasKey();
    });
    return;
  }
  if(p==='__model'){prefs.model=e.target.value.trim(); savePrefs(); return}
  setPath(p,e.target.value);
  save();
});
document.addEventListener('keydown',function(e){
  if(e.target.id==='coachin'&&e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();sendCoach()}
});
document.addEventListener('change',function(e){
  var p=e.target.getAttribute&&e.target.getAttribute('data-num');
  if(!p)return;
  var v=e.target.value;
  setPath(p, v===''?null:Number(v));
  save(); render();
});
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]'); if(!el)return;
  var a=el.getAttribute('data-act');
  var gi=parseInt(el.getAttribute('data-g'),10), ti=parseInt(el.getAttribute('data-t'),10);
  var d=parseInt(el.getAttribute('data-d'),10), w=parseInt(el.getAttribute('data-w'),10);
  var id=el.getAttribute('data-id'), gid=el.getAttribute('data-gid');
  var t=(!isNaN(gi)&&!isNaN(ti))?state.goals[gi].tactics[ti]:null;

  if(a==='tab'){
    stopSpeech();
    view=el.getAttribute('data-v');
    splash=false;
    if(prefs.layout==='coach'){prefs.layout=prefs.prevLayout||'split'; savePrefs()}
    guide=null;
  }
  else if(a==='wk'){week=w; openGoal=null}
  else if(a==='sec'){var id2=el.getAttribute('data-v'); openGoal=(openGoal===id2?'':id2)}
  else if(a==='gow'){week=w;view='week'}
  else if(a==='tw'){var i=t.weeks.indexOf(w); i>-1?t.weeks.splice(i,1):t.weeks.push(w); t.weeks.sort(function(x,y){return x-y})}
  else if(a==='allw'){t.weeks=t.weeks.length===12?[]:WEEKS.slice()}
  else if(a==='pat'){t.days=PATTERNS[parseInt(el.getAttribute('data-p'),10)][1].slice()}
  else if(a==='pd'){t.days=t.days||[];var j=t.days.indexOf(d); j>-1?t.days.splice(j,1):t.days.push(d); t.days.sort(function(x,y){return x-y})}
  else if(a==='addt'){state.goals[gi].tactics.push(blankTactic())}
  else if(a==='rmt'){state.goals[gi].tactics.splice(ti,1)}
  else if(a==='addg'){state.goals.push(blankGoal())}
  else if(a==='addm'){state.goals[gi].measures.push(blankMeasure())}
  else if(a==='rmm'){
    if(!confirm('Remove this measurement and its weekly figures?'))return;
    state.goals[gi].measures.splice(parseInt(el.getAttribute('data-m'),10),1);
  }
  else if(a==='mtac'){state.goals[gi].measures[parseInt(el.getAttribute('data-m'),10)].tacticId=el.getAttribute('data-v')}
  else if(a==='mmode'){state.goals[gi].measures[parseInt(el.getAttribute('data-m'),10)].mode=el.getAttribute('data-v')}
  else if(a==='hidetips'){prefs.tips=false; savePrefs()}
  else if(a==='showtips'){prefs.tips=true; savePrefs()}
  else if(a==='lay'){
    var lv=el.getAttribute('data-v');
    if(lv==='coach'){
      if(prefs.layout!=='coach')prefs.prevLayout=prefs.layout;
      prefs.layout='coach'; guide=null;
    } else {
      prefs.layout=lv; prefs.prevLayout=lv;
    }
    savePrefs();
  }
  else if(a==='side'){prefs.coachSide=prefs.coachSide==='left'?'right':'left'; savePrefs()}
  else if(a==='coachsend'){sendCoach(); return}
  else if(a==='coachask'){coachDraft=el.getAttribute('data-v'); sendCoach(); return}
  else if(a==='coachclear'){chat=[]; coachError=''; saveChat()}
  else if(a==='say'){speakCurrent(); return}
  else if(a==='spktoggle'){togglePlay(); return}
  else if(a==='spkstop'){stopSpeech(); render(); return}
  else if(a==='spkprev'){if(spk.segs.length)playFrom(spk.i-1); else speakCurrent(); return}
  else if(a==='spknext'){if(spk.segs.length)playFrom(spk.i+1); else speakCurrent(); return}
  else if(a==='sayone'){
    if(isSaying()){stopSpeech(); render(); return}
    var mi2=parseInt(el.getAttribute('data-i'),10);
    if(chat[mi2])speak(chat[mi2].content);
    return;
  }
  else if(a==='splash'){splash=true; guide=null; stopSpeech()}
  else if(a==='spback'){splash=false}
  else if(a==='spenable'){testKey(true); return}
  else if(a==='keytest'){testKey(false); return}
  else if(a==='gstart'){guide={flow:el.getAttribute('data-v'),i:0}; splash=false}
  else if(a==='gexit'){guide=null}
  else if(a==='gnext'){guide.i=guide.i+1}
  else if(a==='gback'){guide.i=Math.max(0,guide.i-1)}
  else if(a==='gfocus'){state.vision.focus=el.getAttribute('data-v'); save()}
  else if(a==='gcount'){
    var n=parseInt(el.getAttribute('data-v'),10);
    while(state.goals.length<n)state.goals.push(blankGoal());
    while(state.goals.length>n){
      var last=state.goals[state.goals.length-1];
      if(last.title.trim()||last.tactics.some(function(t){return t.text.trim()}))break;
      state.goals.pop();
    }
  }
  else if(a==='gaddt'){state.goals[gi].tactics.push(blankTactic()); guide.i=guide.i+1}
  else if(a==='gaddm'){state.goals[gi].measures.push(blankMeasure())}
  else if(a==='untick'){
    var wku=ensureWeek(week), tu=findTactic(id);
    if((tu.days||[]).length)wku.days[id]=[]; else wku.done[id]=false;
  }
  else if(a==='gresume'){prefs.layout=prefs.prevLayout||'split'; savePrefs()}
  else if(a==='gcoach'){
    if(prefs.layout!=='coach')prefs.prevLayout=prefs.layout;
    prefs.layout='coach'; savePrefs();
  }
  else if(a==='rmg'){
    if(!confirm('Delete goal '+(gi+1)+' and its tactics? Your weekly ticks for it will be discarded.'))return;
    state.goals.splice(gi,1);
  }
  else if(a==='tick'){
    var wk=ensureWeek(week), tt=findTactic(id), ts=tacticScore(week,tt);
    if(!ts.scheduled)wk.done[id]=!wk.done[id];
    else wk.days[id]=ts.pct===100?[]:tt.days.slice();
  }
  else if(a==='td'){
    var wk2=ensureWeek(week), arr=wk2.days[id]||[], k=arr.indexOf(d);
    k>-1?arr.splice(k,1):arr.push(d); wk2.days[id]=arr;
  }
  else if(a==='pace'){
    var wk3=ensureWeek(week), cur=wk3.results[gid]||blankResult();
    var v=el.getAttribute('data-v');
    cur.onPace=cur.onPace===v?'':v; wk3.results[gid]=cur;
  }
  else if(a==='carry'){
    var p=lastResult(week,gid), wk4=ensureWeek(week);
    var c=wk4.results[gid]||blankResult(); c.toDate=p?p.toDate:''; wk4.results[gid]=c;
  }
  else if(a==='theme'){theme.preset=el.getAttribute('data-v'); saveTheme(); applyTheme(); render(); return}
  else if(a==='mode'){theme.mode=el.getAttribute('data-v'); saveTheme(); applyTheme(); render(); return}
  else if(a==='update'){
    var step=window.caches?caches.keys().then(function(k){return Promise.all(k.map(function(x){return caches.delete(x)}))}):Promise.resolve();
    step.then(function(){
      return (navigator.serviceWorker&&navigator.serviceWorker.getRegistrations)?navigator.serviceWorker.getRegistrations():[];
    }).then(function(rs){
      return Promise.all((rs||[]).map(function(r){return r.unregister()}));
    })['catch'](function(){})
    .then(function(){location.reload()});
    return;
  }
  else if(a==='export'){exportData();return}
  else if(a==='import'){document.getElementById('importer').click();return}
  else if(a==='reset'){
    if(!confirm('Clear the whole plan and start a new 12 week year? This cannot be undone.'))return;
    state=blankState(); week=1;
  }
  else return;
  save(); render();
});
function findTactic(id){
  for(var i=0;i<state.goals.length;i++){
    var f=state.goals[i].tactics.filter(function(t){return t.id===id});
    if(f.length)return f[0];
  }
  return {days:[]};
}
function exportData(){
  var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='12-week-year-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href)},2000);
}
document.getElementById('importer').addEventListener('change',function(e){
  var f=e.target.files[0]; if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(!d.goals)throw 0;
      state=Object.assign(blankState(),d); save(); render();
    }catch(err){alert("That file isn't a 12 Week Year backup.")}
  };
  r.readAsText(f); e.target.value='';
});

/* --------------------------------------------------------------- start up */
loadTheme();
loadPrefs();
loadChat();
if(!coachReady()&&prefs.layout!=='full'){prefs.layout='full'; prefs.prevLayout='full'}
applyTheme();
if(window.matchMedia){
  var mq=window.matchMedia('(prefers-color-scheme: dark)');
  var onScheme=function(){if(theme.mode==='auto')applyTheme()};
  mq.addEventListener?mq.addEventListener('change',onScheme):mq.addListener(onScheme);
}
load();
render();
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){})});
}
</script>
